name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q Julio_proyecto_etapa2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK debug
        working-directory: julio
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: julio-debug-apk
          path: julio/app/build/outputs/apk/debug/*.apk
